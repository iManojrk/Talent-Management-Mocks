name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional note about what are the latest changes being deployed'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload static site artifact (mocks/ as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: mocks

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
