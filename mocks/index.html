<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Talent Management Mocks</title>
    <script>
      (function preventCache() {
        window.__CACHE_BUST = Date.now().toString();
        const style = document.createElement('link');
        style.rel = 'stylesheet';
        style.href = `./styles.css?v=${window.__CACHE_BUST}`;
        document.head.appendChild(style);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function loadAppNoCache() {
        const cacheBust = window.__CACHE_BUST || Date.now().toString();
        const script = document.createElement('script');
        script.type = 'module';
        script.src = `./app.js?v=${cacheBust}`;
        document.body.appendChild(script);
      })();
    </script>
  </body>
  </html>
